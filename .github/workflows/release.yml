name: Release

# Every push to main builds the contain binary for all supported platforms and
# publishes a prerelease tagged with the short commit SHA. The guest kernels are
# NOT shipped here — they're pinned in src/kernel_fetch.zig to their own separate,
# rarely-changing release (kernels-v1) and auto-fetched at runtime.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # create releases + tags

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: contain-linux-x86_64
            bin: contain
          - os: windows-latest
            asset: contain-windows-x86_64
            bin: contain.exe
          - os: macos-latest
            asset: contain-macos-aarch64
            bin: contain
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test
      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: ship the raw .exe — it runs directly (no chmod, and a
            # terminal/curl download carries no mark-of-the-web for SmartScreen).
            cp "zig-out/bin/${{ matrix.bin }}" "dist/${{ matrix.asset }}.exe"
          else
            # Unix: tar.gz preserves the executable bit (a raw release download
            # loses +x) and the ad-hoc HVF-entitlement signature build.zig applies
            # on macOS. The binary is named `contain` inside the archive.
            install -m755 "zig-out/bin/${{ matrix.bin }}" contain
            tar -czf "dist/${{ matrix.asset }}.tar.gz" contain
            rm -f contain
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Gather binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum contain-* > SHA256SUMS && cat SHA256SUMS
      - name: Publish release ${{ needs.version.outputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          prerelease: true
          files: dist/*
