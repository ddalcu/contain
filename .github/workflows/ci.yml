name: CI

on:
  pull_request:
  workflow_dispatch:
  # Pushes to main are built + released by release.yml (which also runs tests),
  # so CI here only guards pull requests.

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: contain-linux-x86_64
            bin: contain
          - os: windows-latest
            artifact: contain-windows-x86_64
            bin: contain.exe
          - os: macos-latest
            artifact: contain-macos-aarch64
            bin: contain
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run unit tests
        run: zig build test

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: zig-out/bin/${{ matrix.bin }}
          if-no-files-found: error
